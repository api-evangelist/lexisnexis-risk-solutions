  Risk Solutions") in the monorepo emailage-public-clients, mirrored from the legacy
  github.com/emailage organisation. LexisNexis.ServicesApi.Client on NuGet was deliberately
  EXCLUDED - it targets advance.lexis.com, the LexisNexis legal-research business, not Risk
  Solutions.
