actions:
  apisYmlCreated: true
  apisListed: 6
  openapiDirectory: false
  gated: true
  status: built-stub
  reason: |
    A real first-party developer portal exists and publicly names six insurance API
    products, so those are recorded as apis[] entries with their real documentation and
    reference URLs. But no reference documentation, base URL, authentication scheme or
    machine-readable definition is available to an anonymous visitor, so this provider is
    a partner-gated stub rather than a captured public API surface. In the United States
    insurance market - no federal regulator, no open-insurance mandate, ACORD/EDI rather
    than APIs as the historical exchange idiom - this is the expected posture for the
    risk-data layer, and recording it accurately is the point.
