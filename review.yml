  acordPosture:
    phrase: ACORD named as an industry-organization alliance partner only; no AL3, ACORD XML, NGDS or IVANS transaction documented publicly
    evidence:
    - url: https://risk.lexisnexis.com/about-us/alliance-partnerships/insurance/industry-organization
      status: 200
      quote: >-
        ACORD (Association for Cooperative Operations Research and Development) is a global, nonprofit
        organization serving the insurance and related industries. ACORD facilitates fast, accurate data
        exchange and more efficient workflows through the development of electronic standards, standardized
        forms, and tools to support their use.
      note: ACORD is listed as a Featured Industry Organization under the Insurance Alliance Program, alongside InsurTech Express and LOMA.
    searchedTerms:
    - ACORD
    - AL3
    - ACORD XML
    - ACORD certified
    - NGDS
    - IVANS
    - agency download
    - Applied Epic
    - Vertafore
    - AMS360
    - TXLife
    negativeFinding: |
      None of AL3, ACORD XML, ACORD certified, NGDS, IVANS, agency download, Applied Epic,
      Vertafore or AMS360 appear on risk.lexisnexis.com/insurance or on the C.L.U.E. Auto,
      Current Carrier, Motor Vehicle Records, InsurView, Driver Discovery or Telematics
      product pages. The company's public ACORD relationship is membership/alliance
      positioning, not a documented ACORD transaction surface.
  insuranceVerbs:
    quote: false
    bind: false
    issue: false
    fnol: false
    note: |
      LexisNexis Risk Solutions is not a carrier and exposes none of the four insurance
      transaction verbs. Its products are risk-data lookups consumed INSIDE the carrier's
      quoting, underwriting and claims workflow (C.L.U.E. claim history, prior-carrier
      verification, MVR, undisclosed-driver detection, public-records attributes, VIN data).
      The audience is carrier and MGA back-office systems, not consumers and not agents
      directly; access is partner-only under contract.
