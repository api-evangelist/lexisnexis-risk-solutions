aid: lexisnexis-risk-solutions
name: LexisNexis Risk Solutions
review:
  question: Does LexisNexis Risk Solutions expose a public, self-serve API surface for its United States insurance products?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  sector: Insurance
  tier: risk-data-analytics
findings:
  summary: |
    LexisNexis Risk Solutions runs a real first-party developer portal at
    https://developer.lexisnexisrisk.com/ (HTTP 200, a SwaggerHub Portal
    instance). The landing page is anonymously readable and publicly
    enumerates six insurance API products with one-line descriptions:
    C.L.U.E. Auto, C.L.U.E. Auto with Current Carrier, Driver Discovery,
    InsurView, Motor Vehicle Record (MVR) and VIN Services. That landing
    page is the entire public surface. Every product route
    (/clue_auto, /clue_auto_cc, /driver_discovery, /insurview, /mvr,
    /vin_services) answers HTTP 302 to
    https://developer.lexisnexisrisk.com/sp-portal/session-expired for an
    anonymous client, so all reference documentation, schemas and endpoint
    detail are behind a login. The portal is therefore classified as a
    partner/customer login wall with a public product catalogue, not a
    self-serve developer portal, and the provider is recorded as gated.

    No OpenAPI or Swagger definition was harvested. /openapi.json,
    /swagger.json, /api-docs and /sitemap.xml all return 404 on the portal;
    the SwaggerHub public registry owner "lnrs" resolves but publishes zero
    APIs (totalCount 0), and no other SwaggerHub owner spelling for the
    company resolved. This is consistent with the United States insurance
    market seam: with no federal insurance regulator and no open-insurance
    mandate, nothing forces disclosure, and a contributory-data business
    with FCRA-regulated content has an affirmative reason not to publish.

    Distribution is through carrier systems rather than through an open API.
    A Guidewire Marketplace listing for "LexisNexis Risk Solutions Motor
    Vehicle Records for PolicyCenter" (HTTP 200) is the visible integration
    seam into policy administration.
