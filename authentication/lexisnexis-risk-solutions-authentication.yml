insurance_products:
  documented: false
  scheme: null
  note: >-
    The six insurance API products on developer.lexisnexisrisk.com (clue_auto, clue_auto_cc,
    driver_discovery, insurview, mvr, vin_services) expose no anonymous authentication
    documentation. Every product route answers 302 to /sp-portal/session-expired, and the
    react-router data route (/mvr.data, /clue_auto.data) returns the same SingleFetchRedirect.
    Credentials are issued under commercial contract.
