note: >-
  There is no OpenAPI in this repo, so nothing here is derived from a spec. The insurance API
  products have NO publicly documented authentication scheme; the only LexisNexis Risk Solutions
  auth model readable on the open web is the one implemented in the company's own published
  Emailage client libraries.
