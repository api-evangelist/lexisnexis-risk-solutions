  - type: APIReference
    url: https://developer.lexisnexisrisk.com/insurview
- aid: lexisnexis-risk-solutions:motor-vehicle-record
  name: Motor Vehicle Record (MVR)
  description: >-
    Motor Vehicle Record data allows insurance companies to evaluate driver histories consistently in
    all fifty states, sourced from state departments of motor vehicles. Listed as an API product on the
    LexisNexis Risk Solutions developer portal (portal product key mvr) and distributed into carrier
    policy administration through a Guidewire PolicyCenter marketplace listing; reference documentation
    is behind authentication and no OpenAPI definition is published publicly.
