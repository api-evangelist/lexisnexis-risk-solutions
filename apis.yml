apis:
- aid: lexisnexis-risk-solutions:clue-auto
  name: C.L.U.E. Auto
  description: >-
    C.L.U.E. Auto is a contributory claim-history information exchange containing up to seven years of
    personal automobile claims matching the search criteria, used by carriers during quoting and
    underwriting. Listed as an API product on the LexisNexis Risk Solutions developer portal
    (portal product key clue_auto); the reference documentation redirects anonymous visitors to a
    login screen, and no OpenAPI definition or base URL is published publicly.
  humanURL: https://developer.lexisnexisrisk.com/clue_auto
  tags:
  - Insurance
  - Auto Insurance
  - Claims
  - Underwriting
  - Risk Data
  properties:
  - type: Documentation
    url: https://risk.lexisnexis.com/products/clue-auto
  - type: APIReference
    url: https://developer.lexisnexisrisk.com/clue_auto
- aid: lexisnexis-risk-solutions:clue-auto-with-current-carrier
  name: C.L.U.E. Auto with Current Carrier
  description: >-
    C.L.U.E. Auto combined with Current Carrier, which identifies the carriers of existing or previous
    insurance policies so an underwriter can validate coverage and underwriting information and assess
    auto and property risk. Listed as an API product on the LexisNexis Risk Solutions developer portal
    (portal product key clue_auto_cc); reference documentation is behind authentication and no OpenAPI
    definition is published publicly.
  humanURL: https://developer.lexisnexisrisk.com/clue_auto_cc
  tags:
  - Insurance
  - Auto Insurance
  - Claims
  - Underwriting
  - Risk Data
  properties:
  - type: Documentation
    url: https://risk.lexisnexis.com/products/current-carrier
  - type: APIReference
    url: https://developer.lexisnexisrisk.com/clue_auto_cc
- aid: lexisnexis-risk-solutions:driver-discovery
  name: Driver Discovery
  description: >-
    Driver Discovery identifies potentially undisclosed drivers residing at an applicant's address,
    helping auto insurance carriers detect additional household drivers that were not declared on the
    application. Listed as an API product on the LexisNexis Risk Solutions developer portal (portal
    product key driver_discovery); reference documentation is behind authentication and no OpenAPI
    definition is published publicly.
  humanURL: https://developer.lexisnexisrisk.com/driver_discovery
  tags:
  - Insurance
  - Auto Insurance
  - Underwriting
  - Risk Data
  properties:
  - type: Documentation
    url: https://risk.lexisnexis.com/products/driver-discovery
  - type: APIReference
    url: https://developer.lexisnexisrisk.com/driver_discovery
- aid: lexisnexis-risk-solutions:insurview
  name: InsurView
  description: >-
    InsurView leverages one of the industry's largest collections of public records and other data
    sources to provide a view of the consumer that complements traditional insurance scoring. Listed
    as an API product on the LexisNexis Risk Solutions developer portal (portal product key insurview);
    reference documentation is behind authentication and no OpenAPI definition is published publicly.
  humanURL: https://developer.lexisnexisrisk.com/insurview
  tags:
  - Insurance
  - Underwriting
  - Risk Data
  - Data Analytics
  properties:
  - type: Documentation
    url: https://risk.lexisnexis.com/products/insurview
  - type: APIReference
    url: https://developer.lexisnexisrisk.com/insurview
- aid: lexisnexis-risk-solutions:motor-vehicle-record
  name: Motor Vehicle Record (MVR)
  description: >-
    Motor Vehicle Record data allows insurance companies to evaluate driver histories consistently in
    all fifty states, sourced from state departments of motor vehicles. Listed as an API product on the
    LexisNexis Risk Solutions developer portal (portal product key mvr) and distributed into carrier
    policy administration through a Guidewire PolicyCenter marketplace listing; reference documentation
    is behind authentication and no OpenAPI definition is published publicly.
  humanURL: https://developer.lexisnexisrisk.com/mvr
  tags:
  - Insurance
  - Auto Insurance
  - Underwriting
  - Risk Data
  - Motor Vehicle Records
  properties:
  - type: Documentation
    url: https://risk.lexisnexis.com/products/motor-vehicle-records
  - type: APIReference
    url: https://developer.lexisnexisrisk.com/mvr
- aid: lexisnexis-risk-solutions:vin-services
  name: VIN Services
  description: >-
    VIN Services provides vehicle registration and title data keyed on the vehicle identification
    number, used in auto quoting, underwriting and prefill. Listed as an API product on the LexisNexis
    Risk Solutions developer portal (portal product key vin_services); reference documentation is
    behind authentication, no marketing product page was found on risk.lexisnexis.com, and no OpenAPI
    definition is published publicly.
  humanURL: https://developer.lexisnexisrisk.com/vin_services
  tags:
  - Insurance
  - Auto Insurance
  - Vehicle Data
  - Risk Data
  properties:
  - type: APIReference
    url: https://developer.lexisnexisrisk.com/vin_services
