url: https://raw.githubusercontent.com/api-evangelist/lexisnexis-risk-solutions/refs/heads/main/apis.yml
name: LexisNexis Risk Solutions
kind: company
description: >-
  LexisNexis Risk Solutions is the risk-data and analytics arm of RELX, headquartered in Alpharetta,
  Georgia, and one of the small number of intermediaries that sit between United States property and
  casualty carriers and the distribution channel. In insurance it does not underwrite risk; it sells
  the contributory databases and scores that carriers rate against — C.L.U.E. Auto claims history,
  Current Carrier prior-coverage verification, Motor Vehicle Records across all fifty states, Driver
  Discovery undisclosed-driver detection, InsurView public-records attributes and VIN Services vehicle
  data — alongside telematics exchange, data prefill, fraud detection, claims and life-insurance
  underwriting products. Because the United States has no federal insurance regulator and no
  open-insurance mandate, value in this market accrued to exactly this layer rather than to the
  carriers, and LexisNexis Risk reaches its customers through carrier policy-administration and rating
  systems (a Guidewire PolicyCenter marketplace listing for Motor Vehicle Records is the visible
  example) rather than through an open API. Its API posture reflects that: a real first-party developer
  portal exists at developer.lexisnexisrisk.com, built on SwaggerHub Portal, and it publicly enumerates
  six insurance API products with descriptions — but every product page redirects an anonymous visitor
  to a session-expired login screen. No OpenAPI or Swagger definition, no base URL, no scopes, no
  webhook catalog and no Postman collection are published to the open web. Access is contract-first
  and partner-gated; the six entries below are recorded as named, first-party-documented API products
  whose reference documentation is behind authentication.
