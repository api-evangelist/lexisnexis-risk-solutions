  - type: APIReference
    url: https://developer.lexisnexisrisk.com/vin_services
- aid: lexisnexis-risk-solutions:emailage
  name: LexisNexis Emailage
  description: >-
    LexisNexis Emailage is an email and IP address fraud-risk scoring API acquired by LexisNexis
    Risk Solutions in 2020. It returns a real-time risk score and advice band for an email address
    and/or IP address, used in transaction fraud screening. Unlike the six insurance products it
    has first-party client libraries published to public registries (PyPI, RubyGems, NuGet) and
    maintained in the company GitHub organisation, and those libraries hard-code the production
    and sandbox host names. No OpenAPI definition is published; credentials (Account SID plus auth
    token, signed with OAuth 1.0a HMAC-SHA256/384/512, or OAuth 2.0 client credentials) are issued
    under commercial contract.
  humanURL: https://risk.lexisnexis.com/products/lexisnexis-emailage
  baseURL: https://api.emailage.com
  tags:
  - Fraud Detection
  - Identity
  - Risk Data
  - Email Intelligence
  - Data Analytics
